<text x="56" y="660" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#697586" text-anchor="start">Every thread of the process (main, workers, GC, native pool) shares N CPUs. The dashed line runs rusteerio's sync API in a worker_threads pool, the same setup as the JS libraries; extractAll is limited by its main thread.</text>
