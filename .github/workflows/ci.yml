name: Build, test and package

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable source commit to build and test
        type: string
        default: ''
      release:
        description: Disable dependency caches for a release build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ !inputs.release && 'npm' || '' }}
      # Review and regenerate the bundled standard-library notices when changing Rust.
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check the reviewed Rust compiler
        run: node -e "require('node:assert/strict').equal(require('node:child_process').execFileSync('rustc', ['--version'], {encoding:'utf8'}).split(' ')[1], '1.99.0')"
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm run check
      - run: npm test
      - run: npm run test:upstream
      - run: npm run test:types
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  gnu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:4131ddd7acb9c6c966af02fe7e71edc51e078c2d41f475966697676430bfa2ae
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:abd1230aa9e4058a74b89d27cd14ba18c0db036d7bfe6e6f219a29ea63c24eb6
    runs-on: ${{ matrix.os }}
    # Compile and run on the oldest supported libc, instead of merely changing
    # the binary filename. check-native verifies ELF symbol-version requirements.
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ !inputs.release && 'npm' || '' }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check the reviewed Rust compiler and libc baseline
        run: |
          node -e "require('node:assert/strict').equal(require('node:child_process').execFileSync('rustc', ['--version'], {encoding:'utf8'}).split(' ')[1], '1.99.0')"
          getconf GNU_LIBC_VERSION | grep -x 'glibc 2.28'
      - uses: Swatinem/rust-cache@v2
        if: ${{ !inputs.release }}
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: npm run notices:check
      - run: npm run check
      - run: npm test
      - run: npm run test:upstream
      - run: npm run test:types
      - run: npm run test:package
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error

  musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build and test on Alpine
        run: |
          # This tested multi-architecture image and Rust version share the bundled notices.
          docker run --rm -v "$PWD:/work" -w /work node:22-alpine3.24@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402 sh -ec '
            apk add --no-cache cargo=1.96.1-r0 rust=1.96.1-r0 clang build-base python3 git
            rustc --version
            case "$(rustc --version)" in
              "rustc 1.96.1 "*) ;;
              *) exit 1 ;;
            esac
            npm ci
            npm run notices:check
            npm run build
            npm test
            npm run test:upstream
            npm run test:types
            npm run test:package
          '
      - uses: actions/upload-artifact@v7
        with:
          name: native-linux-${{ matrix.arch }}-musl
          path: '*.node'
          if-no-files-found: error

  package:
    needs: [native, gnu, musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: ${{ !inputs.release && 'npm' || '' }}
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
      - run: npm run build:ts
      - run: node scripts/check-native.mjs --all
      - run: npm run release:check
      - run: mkdir release
      - run: npm pack --ignore-scripts --pack-destination release
      - name: Verify the exact release tarball
        run: npm run release:check -- --tarball release --commit "$SOURCE_COMMIT" --manifest release/manifest.json
        env:
          SOURCE_COMMIT: ${{ inputs.ref || github.sha }}
      - name: Test the exact release tarball
        run: npm run test:package -- release
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: release/*
          if-no-files-found: error

  node-versions:
    needs: gnu
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: ['20.19.0', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ !inputs.release && 'npm' || '' }}
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-unknown-linux-gnu
      - run: npm ci
      - run: npm run build:ts
      - run: npm test
      - run: npm run test:upstream

  performance:
    needs: gnu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ !inputs.release && 'npm' || '' }}
      - uses: actions/download-artifact@v8
        with:
          name: native-x86_64-unknown-linux-gnu
      - run: npm ci
      - run: npm run build:ts
      - name: Check that operations keep their lead over Cheerio
        run: npm run bench:gate
